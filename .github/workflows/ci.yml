name: CI Mobile KMP GymVIP

on:
  push:
    branches:
      - ACOSTA-MEJORAS-Y-ACTUALIZACIONES
      - S2-REVISION-QA
      - 'feature/**'
      - main
  pull_request:
    branches:
      - ACOSTA-MEJORAS-Y-ACTUALIZACIONES
      - S2-REVISION-QA
      - main

jobs:
  test:
    name: Test Kotlin Multiplatform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar Pruebas Unitarias y Compilación Debug
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --stacktrace
